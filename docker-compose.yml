version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examforge-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - examforge-storage:/app/storage
      - ./.env:/app/.env:ro
    environment:
      - PORT=8000
      - ENV=development
    networks:
      - examforge-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: examforge-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - examforge-network
    restart: unless-stopped

volumes:
  examforge-storage:
    driver: local

networks:
  examforge-network:
    driver: bridge
