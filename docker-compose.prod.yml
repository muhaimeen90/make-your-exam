version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examforge-backend-prod
    expose:
      - "8000"
    volumes:
      - examforge-storage:/app/storage
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENV=production
    networks:
      - examforge-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: examforge-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - examforge-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  examforge-storage:
    driver: local

networks:
  examforge-network:
    driver: bridge
